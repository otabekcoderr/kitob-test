<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <!-- =====================================================
       META
  ====================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- SEO -->
  <title>Kitobchi — O'zbek kitoblar testi platformasi</title>
  <meta name="description"
    content="O'zbek adabiyoti bo'yicha testlar yeching, bilimingizni sinang va reyting jadvali orqali raqobatlashing." />
  <meta name="keywords"
    content="kitob, test, o'zbek adabiyoti, kitobchi, bilim, reyting" />
  <meta name="author" content="Kitobchi" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Kitobchi — O'zbek kitoblar testi" />
  <meta property="og:description" content="O'zbek adabiyoti bo'yicha testlar yeching va bilimingizni sinang." />
  <meta property="og:locale"      content="uz_UZ" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <rect width='100' height='100' rx='12' fill='%23B76E16'/>
      <text x='50' y='72' font-size='60' text-anchor='middle' fill='white' font-family='Georgia,serif' font-weight='700'>K</text>
    </svg>" />

  <!-- =====================================================
       CSS
  ====================================================== -->
  <link rel="stylesheet" href="css/style.css?v=7.4.0" />

  <!-- =====================================================
       APP (ES Module)
  ====================================================== -->
  <script type="module" src="js/app.js?v=7.4.0"></script>
</head>

<body>
  <!-- Skip navigatsiya (accessibility) -->
  <a href="#app" class="skip-link">Asosiy kontentga o'tish</a>

  <!-- =====================================================
       NAVBAR (app.js tomonidan to'ldiriladi)
  ====================================================== -->
  <header id="navbar" role="banner"></header>

  <!-- =====================================================
       ASOSIY KONTENT
       app.js router har bir sahifani shu elementga render qiladi
  ====================================================== -->
  <main id="app" tabindex="-1">
    <!--
      Birinchi yuklash: JS ishga tushguncha ko'rsatiladigan
      loading ekrani. app.js render qilganida o'chadi.
    -->
    <div id="initial-loader" aria-label="Yuklanmoqda..."
         style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;background:var(--paper);">
      <div style="width:40px;height:40px;background:var(--ochre,#B76E16);border-radius:6px;display:flex;align-items:center;justify-content:center;">
        <span style="font-family:Georgia,serif;font-size:1.25rem;font-weight:700;color:#fff;">K</span>
      </div>
      <div style="width:32px;height:32px;border:2.5px solid var(--divider,#D8D0C1);border-top-color:var(--ochre,#B76E16);border-radius:50%;animation:spin .7s linear infinite;"></div>
    </div>
  </main>

  <!-- =====================================================
       FOOTER
  ====================================================== -->
  <footer class="footer" role="contentinfo">
    <p>© <span id="footer-year"></span> Kitobchi. Barcha huquqlar himoyalangan.</p>
  </footer>

  <!-- =====================================================
       INLINE SCRIPT — faqat eng muhim boshlang'ich ishlar:
       1. Temani FOUC (Flash of Unstyled Content) dan himoya
       2. Footer yilni dinamik qo'yish
  ====================================================== -->
  <script>
    // Temani iloji boricha ertaroq qo'llash (FOUC oldini olish)
    (function () {
      try {
        var saved = localStorage.getItem('kitobchi_theme');
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* ignore */ }
    })();

    // Footer yil
    var yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>
</body>
</html>
