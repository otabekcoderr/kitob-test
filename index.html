<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <!-- =====================================================
       META
  ====================================================== -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="theme-color" content="#F8F4EA" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- SEO -->
  <title>Kitobchi — O'zbek kitoblar testi platformasi</title>
  <meta name="description"
    content="O'zbek adabiyoti bo'yicha testlar yeching, bilimingizni sinang va reyting jadvali orqali raqobatlashing." />
  <meta name="keywords"
    content="kitob, test, o'zbek adabiyoti, kitobchi, bilim, reyting" />
  <meta name="author" content="Kitobchi" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="Kitobchi — O'zbek kitoblar testi" />
  <meta property="og:description" content="O'zbek adabiyoti bo'yicha testlar yeching va bilimingizni sinang." />
  <meta property="og:locale"      content="uz_UZ" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <!-- =====================================================
       CSS
  ====================================================== -->
  <link rel="stylesheet" href="css/style.css?v=8.0.0" />

  <!-- =====================================================
       APP (ES Module)
  ====================================================== -->
  <script type="module" src="js/app.js?v=8.0.0"></script>
</head>

<body>
  <!-- Skip navigatsiya (accessibility) -->
  <a href="#app" class="skip-link">Asosiy kontentga o'tish</a>

  <!-- =====================================================
       NAVBAR (app.js tomonidan to'ldiriladi)
  ====================================================== -->
  <header id="navbar" role="banner"></header>

  <!-- =====================================================
       ASOSIY KONTENT
       app.js router har bir sahifani shu elementga render qiladi
  ====================================================== -->
  <main id="app" tabindex="-1">
    <!--
      Birinchi yuklash: JS ishga tushguncha ko'rsatiladigan
      animatsiyali logotip. app.js render qilganida o'chadi.
    -->
    <div id="initial-loader" class="page-loader" aria-label="Yuklanmoqda..."
         style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:var(--paper);">
      <div class="page-loader__logo-anim" role="status" aria-label="Kitobchi yuklanmoqda">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" class="kitobchi-logo-svg" aria-hidden="true">
          <!-- Chap kitob ustuni (K poyasi) -->
          <rect x="12" y="10" width="10" height="44" rx="3.5" fill="#D97706"/>
          <line x1="17" y1="14" x2="17" y2="50" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.6"/>
          <!-- Yuqori o'ng sahifa (K yuqori qanoti) -->
          <path d="M22 28 C26 21 34 14 46 11 C47.7 10.5 49.5 11.8 49.5 13.6 L49.5 20.2 C49.5 21.2 48.7 22.1 47.7 22.4 C39 25 32 30 26.5 35.5 Z" fill="#F59E0B"/>
          <path d="M28 25 C34 20 40 16 46 14.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
          <!-- Quyi o'ng sahifa (K quyi qanoti) -->
          <path d="M23 33 C31 38.5 39 44.5 47.5 47.8 C48.8 48.3 49.5 49.5 49.5 50.8 L49.5 54.2 C49.5 55.9 47.7 57.1 46.1 56.4 C34 51 26 42 22 36 Z" fill="#D97706"/>
          <!-- Markaziy ma'rifat nuqtasi -->
          <circle cx="23.5" cy="32" r="2.5" fill="#FEF3C7"/>
          <circle cx="23.5" cy="32" r="4.5" stroke="#FEF3C7" stroke-width="0.75" stroke-opacity="0.6"/>
        </svg>
      </div>
    </div>
  </main>

  <!-- =====================================================
       FOOTER
  ====================================================== -->
  <footer class="footer" role="contentinfo">
    <p>© <span id="footer-year"></span> Kitobchi. Barcha huquqlar himoyalangan.</p>
  </footer>

  <!-- =====================================================
       INLINE SCRIPT — faqat eng muhim boshlang'ich ishlar:
       1. Temani FOUC (Flash of Unstyled Content) dan himoya
       2. Footer yilni dinamik qo'yish
  ====================================================== -->
  <script>
    // Temani iloji boricha ertaroq qo'llash (FOUC oldini olish)
    (function () {
      try {
        var saved = localStorage.getItem('kitobchi_theme');
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* ignore */ }
    })();

    // Footer yil
    var yearEl = document.getElementById('footer-year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>
</body>
</html>
